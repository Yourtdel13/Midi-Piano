<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双剑合璧 · 分镜预览 v3.67</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#101a33,#05070f 60%,#02040a);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf2ff}
#cv{position:fixed;inset:0;width:100vw;height:100vh}
.title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,86vw);text-align:center;pointer-events:none;z-index:2}
.title .t{font-size:52px;font-weight:800;letter-spacing:.14em;color:#fff;text-shadow:0 0 26px rgba(120,180,255,.55)}
.title .s{margin-top:8px;font-size:11px;letter-spacing:.42em;color:#8fb6e8;opacity:.75}
.line{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,rgba(200,230,255,.85),transparent);box-shadow:0 0 14px rgba(140,190,255,.6)}
.line.top{top:-38px}.line.bot{bottom:-38px}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.bar button{background:rgba(20,30,52,.85);color:#dce8ff;border:1px solid rgba(130,170,255,.28);border-radius:999px;padding:9px 18px;font-size:13px}
.hint{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);font-size:11px;color:#7f95b8;letter-spacing:.14em;text-align:center;line-height:1.7}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="title" id="tw">
  <div class="line top" id="lineTop"></div>
  <div class="t">MIDI 钢琴</div>
  <div class="s" id="phase">0–1s · 六芒星居合</div>
  <div class="line bot" id="lineBot"></div>
</div>
<div class="hint">1.0s 六芒星 → 1.7s 横斩 → 1.9s 中心气流（红）→ 2.3s 全线气流 + 斩断装饰线（震动）→ 2.6s 粒子消散</div>
<div class="bar"><button id="replay">重播</button><button id="auto">停止循环</button></div>
<script>
(function(){
  var cv=document.getElementById('cv'),c=cv.getContext('2d'),phaseEl=document.getElementById('phase');
  var W,H,dpr,t0=0,raf=0,auto=true,running=false,broken=false,wind=[],debris=[];
  var tw=document.getElementById('tw');
  function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);}
  addEventListener('resize',resize);resize();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function lineRects(){return [document.getElementById('lineTop'),document.getElementById('lineBot')].map(function(el){var b=el.getBoundingClientRect();return{x:b.left,y:b.top,w:b.width};});}
  function start(){cancelAnimationFrame(raf);t0=performance.now();running=true;broken=false;wind=[];debris=[];raf=requestAnimationFrame(frame);}
  function segHit(x1,y1,x2,y2,x3,y3,x4,y4){var d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);if(Math.abs(d)<1e-6)return null;var ua=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d,ub=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;if(ua<0||ua>1||ub<0||ub>1)return null;return{x:x1+ua*(x2-x1),y:y1+ua*(y2-y1)};}
  function drawSeg(a,b,prog,dim){
    if(prog<=0)return;var ex=a.x+(b.x-a.x)*prog,ey=a.y+(b.y-a.y)*prog;
    c.save();c.globalAlpha=dim*.85;c.shadowColor='#7fdcff';c.shadowBlur=44;c.strokeStyle='rgba(130,220,255,.75)';c.lineWidth=4.2;c.lineCap='round';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(ex,ey);c.stroke();
    c.globalAlpha=dim;c.shadowColor='#fff';c.shadowBlur=24;c.strokeStyle='#fff';c.lineWidth=1.7;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(ex,ey);c.stroke();
    c.fillStyle='#fff';c.shadowColor='#fff';c.shadowBlur=30;c.beginPath();c.arc(ex,ey,2.0,0,7);c.fill();c.restore();
  }
  function frame(now){
    if(!running)return;var t=(now-t0)/1000;c.clearRect(0,0,W,H);
    var cx=W/2,cy=H*.5,R=Math.min(W,H)*.34,pts=[];
    for(var i=0;i<6;i++){var an=-Math.PI/2+i*Math.PI/3;pts.push({x:cx+Math.cos(an)*R,y:cy+Math.sin(an)*R});}
    var order=[[0,2],[2,4],[4,0],[1,3],[3,5],[5,1]];
    var dim=t>2.4?Math.max(0,1-(t-2.4)/0.8):1;
    var shake=(t>=2.1&&t<2.55)?19:0;
    c.save();if(shake)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    if(t<2.3){c.save();c.strokeStyle='rgba(200,230,255,.85)';c.shadowColor='rgba(140,190,255,.6)';c.shadowBlur=14;c.lineWidth=2;var L=lineRects();for(var li=0;li<L.length;li++){c.beginPath();c.moveTo(L[li].x,L[li].y);c.lineTo(L[li].x+L[li].w,L[li].y);c.stroke();}c.restore();}
    for(var s=0;s<6;s++){var e=order[s],pr=Math.max(0,Math.min(1,(t-(.03+s*.10))/.10));drawSeg(pts[e[0]],pts[e[1]],pr,dim);}
    var midA={x:W*.04,y:H*.5},midB={x:W*.96,y:H*.5},mp=Math.max(0,Math.min(1,(t-1.5)/.12));
    if(mp>0){c.save();c.globalAlpha=dim*.8;c.shadowColor='#ffd9dc';c.shadowBlur=50;c.strokeStyle='rgba(255,190,200,.8)';c.lineWidth=9;c.beginPath();c.moveTo(midA.x,midA.y);c.lineTo(midA.x+(midB.x-midA.x)*mp,midB.y);c.stroke();c.globalAlpha=dim;c.shadowColor='#fff';c.shadowBlur=30;c.strokeStyle='#fff';c.lineWidth=2.6;c.beginPath();c.moveTo(midA.x,midA.y);c.lineTo(midA.x+(midB.x-midA.x)*mp,midB.y);c.stroke();c.restore();}
    if(t>=1.7&&wind.length===0){for(var w=0;w<40;w++){var d0=Math.random()<.5?-1:1;wind.push({x:W/2+rnd(-W*.3,W*.3),y:H/2+rnd(-8,8),vx:d0*rnd(260,720),vy:rnd(-20,20),life:.6});}for(var r=0;r<8;r++)wind.push({x:W/2+rnd(-W*.12,W*.12),y:H/2+rnd(-3,3),vx:(Math.random()<.5?-1:1)*rnd(700,1300),vy:rnd(-6,6),life:.7,red:true});}
    if(t>=2.1&&!broken){
      broken=true;
      for(var s2=0;s2<6;s2++){var e2=order[s2],A2=pts[e2[0]],B2=pts[e2[1]];for(var w2=0;w2<16;w2++)wind.push({x:A2.x+(B2.x-A2.x)*Math.random(),y:A2.y+(B2.y-A2.y)*Math.random(),vx:rnd(-560,560),vy:rnd(-340,340),life:.8});}
      var L2=lineRects();
      for(var lb=0;lb<L2.length;lb++){
        var cuts=[];
        for(var sb2=0;sb2<6;sb2++){var eb=order[sb2],Ab=pts[eb[0]],Bb=pts[eb[1]],hb=segHit(Ab.x,Ab.y,Bb.x,Bb.y,L2[lb].x,L2[lb].y,L2[lb].x+L2[lb].w,L2[lb].y);if(hb)cuts.push(hb.x);}
        cuts.sort(function(a,b){return a-b;});
        var xs=[L2[lb].x].concat(cuts,[L2[lb].x+L2[lb].w]);
        for(var k=0;k<xs.length-1;k++){if(xs[k+1]-xs[k]<4)continue;debris.push({x:(xs[k]+xs[k+1])/2,y:L2[lb].y,ang:0,len:xs[k+1]-xs[k],vx:rnd(-26,26),vy:rnd(90,220),vr:rnd(-2.2,2.2),life:3.2,max:3.2});for(var sp=0;sp<8;sp++)debris.push({x:(xs[k]+xs[k+1])/2+rnd(-12,12),y:L2[lb].y+rnd(-4,4),ang:0,len:2,vx:rnd(-90,90),vy:rnd(-110,-20),vr:rnd(-3,3),life:rnd(.6,1.2),max:1.2,spark:true});}
      }
    }
    if(t>2.6&&dim>0){for(var sp2=0;sp2<6;sp2++){var eS=order[Math.floor(Math.random()*6)],AS=pts[eS[0]],BS=pts[eS[1]],pS=Math.random();debris.push({x:AS.x+(BS.x-AS.x)*pS,y:AS.y+(BS.y-AS.y)*pS,ang:0,len:2,vx:rnd(-18,18),vy:rnd(-60,-12),vr:rnd(-2,2),life:1.2,max:1.2,spark:true});}}
    for(var wi=wind.length-1;wi>=0;wi--){var p=wind[wi];if(p.life<=0){wind.splice(wi,1);continue;}c.save();c.globalAlpha=Math.max(0,p.life);c.strokeStyle=p.red?'rgba(255,70,90,.95)':'rgba(225,245,255,.85)';c.lineWidth=p.red?3:2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);c.stroke();c.restore();p.x+=p.vx*.016;p.y+=p.vy*.016;p.life-=.03;}
    for(var di=debris.length-1;di>=0;di--){var d=debris[di];if(d.life<=0){debris.splice(di,1);continue;}
      c.save();c.translate(d.x,d.y);c.rotate(d.ang);c.globalAlpha=d.spark?Math.max(0,d.life/d.max):Math.max(0,Math.min(1,(H+90-d.y)/(H*0.18+90)));c.shadowColor='#bfe6ff';c.shadowBlur=22;
      if(d.spark){c.fillStyle='#dff4ff';c.beginPath();c.arc(0,0,1.8,0,7);c.fill();}else{c.strokeStyle='#f4fbff';c.lineWidth=3;c.beginPath();c.moveTo(-d.len/2,0);c.lineTo(d.len/2,0);c.stroke();}
      c.restore();d.x+=d.vx*.016;d.y+=d.vy*.016;d.vy+=(d.spark?280:1500)*.016;d.ang+=d.vr*.016;d.life-=.016;}
    c.restore();
    phaseEl.textContent=t<1? '0–1s · 六芒星居合' : t<1.7? '1.0–1.7s · 空余' : t<1.9? '1.7s · 中央横斩' : t<2.3? '1.9s · 中心气流（红）' : t<2.6? '2.3s · 全线气流 + 断线震动' : '2.6s+ · 粒子消散';
    if(t<4.2)raf=requestAnimationFrame(frame);else{running=false;phaseEl.textContent='结束';if(auto)setTimeout(start,600);}
  }
  document.getElementById('replay').onclick=start;
  document.getElementById('auto').onclick=function(){auto=!auto;this.textContent=auto?'停止循环':'自动循环';if(auto&&!running)start();};
  start();
})();
</script></body></html>
