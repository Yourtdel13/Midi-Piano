<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双剑合璧 · 固定分镜预览</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#101a33,#05070f 60%,#02040a);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf2ff}
#cv{position:fixed;inset:0;width:100vw;height:100vh}
.title{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,86vw);text-align:center;pointer-events:none;z-index:2}
.title .t{font-size:52px;font-weight:800;letter-spacing:.14em;color:#fff;text-shadow:0 0 26px rgba(120,180,255,.5)}
.title .s{margin-top:8px;font-size:11px;letter-spacing:.42em;color:#8fb6e8;opacity:.75}
.line{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,rgba(190,220,255,.7),transparent);box-shadow:0 0 12px rgba(120,170,255,.45)}
.line.top{top:-38px}.line.bot{bottom:-38px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.bar button{background:rgba(20,30,52,.85);color:#dce8ff;border:1px solid rgba(130,170,255,.28);border-radius:999px;padding:9px 18px;font-size:13px}
.hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);font-size:11px;color:#7f95b8;letter-spacing:.16em}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="title">
  <div class="line top"></div>
  <div class="t">MIDI 钢琴</div>
  <div class="s" id="phase">0–2s · 六芒星居合</div>
  <div class="line bot"></div>
</div>
<div class="hint">0 六芒星 → 2.3s 横斩 → 2.5s 中心气流 → 2.9s 全线气流 + 斩断装饰线</div>
<div class="bar"><button id="replay">重播</button><button id="auto">停止循环</button></div>
<script>
(function(){
  var cv=document.getElementById('cv'),c=cv.getContext('2d'),phaseEl=document.getElementById('phase');
  var W,H,dpr,t0=0,raf=0,auto=true,running=false,broken=false;
  var star=[],wind=[],debris=[];
  function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);}
  addEventListener('resize',resize);resize();
  function rnd(a,b){return a+Math.random()*(b-a);}
  function build(){
    star=[];wind=[];debris=[];broken=false;
    var cx=W/2, cy=H*0.5, R=Math.min(W,H)*0.34, pts=[];
    for(var i=0;i<6;i++){var a=-Math.PI/2+i*Math.PI/3;pts.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R});}
    // hexagram edges: two triangles (0,2,4) and (1,3,5)
    var order=[[0,2],[2,4],[4,0],[1,3],[3,5],[5,1]];
    for(var k=0;k<6;k++){var e=order[k];star.push({a:pts[e[0]],b:pts[e[1]],t0:0.18+k*0.28,dur:0.18});}
  }
  function start(){cancelAnimationFrame(raf);build();t0=performance.now();running=true;raf=requestAnimationFrame(frame);}
  function hitSeg(x1,y1,x2,y2,x3,y3,x4,y4){var d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);if(Math.abs(d)<1e-6)return null;var ua=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d,ub=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;if(ua<0||ua>1||ub<0||ub>1)return null;return{x:x1+ua*(x2-x1),y:y1+ua*(y2-y1)};}
  function lineY(i){return i?H*0.5+Math.min(W,H)*0.20:H*0.5-Math.min(W,H)*0.20;}
  function drawSlash(a,b,prog,color,width,glow){
    if(prog<=0)return;var ex=a.x+(b.x-a.x)*prog,ey=a.y+(b.y-a.y)*prog;
    c.save();c.shadowColor=color;c.shadowBlur=glow;c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';
    c.beginPath();c.moveTo(a.x,a.y);c.lineTo(ex,ey);c.stroke();
    c.globalAlpha=1;c.fillStyle='#fff';c.shadowColor='#fff';c.shadowBlur=glow*1.4;c.beginPath();c.arc(ex,ey,width*0.55,0,7);c.fill();c.restore();
  }
  function frame(now){
    if(!running)return;var t=(now-t0)/1000;c.clearRect(0,0,W,H);
    // decorative lines get cut at 2.9
    if(t<2.9){
      c.save();c.strokeStyle='rgba(190,220,255,.7)';c.shadowColor='rgba(120,170,255,.5)';c.shadowBlur=12;c.lineWidth=2;
      for(var i=0;i<2;i++){var y=lineY(i);c.beginPath();c.moveTo(W*0.07,y);c.lineTo(W*0.93,y);c.stroke();}
      c.restore();
    }
    // phase 1: star slashes 0..2s
    if(t<2.0)phaseEl.textContent='0–2s · 六芒星居合';
    for(var s=0;s<star.length;s++){var st=star[s],pr=Math.max(0,Math.min(1,(t-st.t0)/st.dur));drawSlash(st.a,st.b,pr,'rgba(220,245,255,.95)',2.6,18);}
    // phase 2: middle horizontal slash at 2.3
    var midA={x:W*0.04,y:H*0.5},midB={x:W*0.96,y:H*0.5};
    var mp=Math.max(0,Math.min(1,(t-2.3)/0.18));
    if(t>=2.3)phaseEl.textContent='2.3s · 中央横斩';
    drawSlash(midA,midB,mp,'rgba(255,235,235,.95)',4.2,24);
    // 2.5s: middle slash triggers wind burst
    if(t>=2.5&&wind.length===0){for(var w=0;w<44;w++){var dir=Math.random()<.5?-1:1;wind.push({x:W/2+rnd(-W*.3,W*.3),y:H/2+rnd(-8,8),vx:dir*rnd(260,720),vy:rnd(-20,20),len:rnd(20,80),life:0.5});}phaseEl.textContent='2.5s · 中央气流斩';}
    // 2.9s: all slashes emit wind + strip lines break
    if(t>=2.9&&!broken){
      broken=true;
      for(var s2=0;s2<star.length;s2++){var st2=star[s2];for(var w2=0;w2<10;w2++)wind.push({x:st2.a.x+(st2.b.x-st2.a.x)*Math.random(),y:st2.a.y+(st2.b.y-st2.a.y)*Math.random(),vx:rnd(-560,560),vy:rnd(-260,260),len:rnd(14,46),life:0.6});}
      // break the two decorative lines into segments
      for(var li=0;li<2;li++){
        var y=lineY(li),segW=W*0.86, x0=W*0.07;
        var cut=[];
        for(var si=0;si<star.length;si++){var h=hitSeg(star[si].a.x,star[si].a.y,star[si].b.x,star[si].b.y,x0,y,x0+segW,y);if(h)cut.push(h.x);}
        cut.sort(function(a,b){return a-b;});
        var xs=[x0].concat(cut,[x0+segW]);
        for(var k=0;k<xs.length-1;k++){if(xs[k+1]-xs[k]<4)continue;debris.push({x:(xs[k]+xs[k+1])/2,y:y,len:xs[k+1]-xs[k],ang:0,vx:rnd(-30,30),vy:rnd(-40,10),vr:rnd(-3,3),life:1.4,max:1.4});}
      }
      phaseEl.textContent='2.9s · 全线气流，装饰线断裂';
    }
    // wind streaks
    for(var wi=wind.length-1;wi>=0;wi--){var p=wind[wi];if(p.life<=0){wind.splice(wi,1);continue;}
      c.save();c.globalAlpha=Math.max(0,p.life);c.strokeStyle='rgba(225,245,255,.85)';c.lineWidth=1.4;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*0.04,p.y-p.vy*0.04);c.stroke();c.restore();
      p.x+=p.vx*0.016;p.y+=p.vy*0.016;p.life-=0.03;
    }
    // decorative debris
    for(var di=debris.length-1;di>=0;di--){var d=debris[di];if(d.life<=0){debris.splice(di,1);continue;}
      c.save();c.translate(d.x,d.y);c.rotate(d.ang);c.globalAlpha=Math.max(0,d.life/d.max);c.strokeStyle='rgba(185,220,255,.85)';c.shadowColor='rgba(120,170,255,.5)';c.shadowBlur=8;c.lineWidth=2;c.beginPath();c.moveTo(-d.len/2,0);c.lineTo(d.len/2,0);c.stroke();c.restore();
      d.x+=d.vx*.016;d.y+=d.vy*.016;d.vy+=760*.016;d.ang+=d.vr*.016;d.life-=.016;
    }
    // fade out everything after 3.4
    if(t>3.4){var fade=Math.max(0,1-(t-3.4)/0.7);c.globalAlpha=fade;c.fillStyle='#05070f';c.fillRect(0,0,W,H);c.globalAlpha=1;}
    if(t<4.2)raf=requestAnimationFrame(frame);else{running=false;phaseEl.textContent='结束';if(auto)setTimeout(start,600);}
  }
  document.getElementById('replay').onclick=start;
  document.getElementById('auto').onclick=function(){auto=!auto;this.textContent=auto?'停止循环':'自动循环';if(auto&&!running)start();};
  start();
})();
</script></body></html>
